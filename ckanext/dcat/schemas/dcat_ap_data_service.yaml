scheming_version: 2
dataset_type: data_service
about: Full DCAT AP Data Service schema
about_url: http://github.com/ckan/ckanext-dcat

dataset_fields:

  # Common properties with dcat:Dataset

- field_name: title
  label: Title
  preset: title
  required: true
  help_text: A descriptive title for the data service.

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: eg. my-data service

- field_name: notes
  label: Description
  form_snippet: markdown.html
  help_text: A free-text account of the data service.

- field_name: tag_string
  label: Keywords
  preset: tag_string_autocomplete
  form_placeholder: eg. economy, mental health, government
  help_text: Keywords or tags describing the data service. Use commas to separate multiple values.


  # dcat:DataService specific properties

- field_name: endpoint_url
  label: Endpoint URL
  form_placeholder: http://example.com/apis/data-service
  display_snippet: link.html
  help_text: The root location or primary endpoint of the service.

- field_name: endpoint_description
  label: Endpoint description
  form_snippet: markdown.html
  help_text: A description of the services available via the end-points, including their operations, parameters etc.

  # TODO: custom validator / snippet for multiple formats
- field_name: format
  label: Format
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: The formats that can be returned by querying the endpoint URL.

  # TODO: custom validator / snippet for referencing datasets
- field_name: serves_dataset
  label: Serves dataset(s)
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: Datasets that this data service can distribute.

  # Common properties with dcat:Dataset

- field_name: contact
  label: Contact points
  repeating_label: Contact point
  repeating_subfields:

    - field_name: uri
      label: URI

    - field_name: name
      label: Name

    - field_name: email
      label: Email
      display_snippet: email.html

    - field_name: identifier
      label: Identifier
      help_text: Unique identifier for the contact point. Such as a ROR ID.
    
    - field_name: url
      label: URL
      help_text: A URL associated with the contact
  help_text: Contact information for enquiries about the data service.

- field_name: publisher
  label: Publisher
  repeating_label: Publisher
  repeating_once: true
  repeating_subfields:

    - field_name: uri
      label: URI

    - field_name: name
      label: Name

    - field_name: email
      label: Email
      display_snippet: email.html

    - field_name: url
      label: URL
      display_snippet: link.html

    - field_name: type
      label: Type

    - field_name: identifier
      label: Identifier
      help_text: Unique identifier for the publisher, such as a ROR ID.
  help_text: Entity responsible for making the data service available.

- field_name: license_id
  label: License
  form_snippet: license.html
  help_text: License definitions and additional information can be found at http://opendefinition.org/.

- field_name: owner_org
  label: Organization
  preset: dataset_organization
  help_text: The CKAN organization the data service belongs to.

- field_name: url
  label: Landing page
  form_placeholder: http://example.com/data-service.html
  display_snippet: link.html
  help_text: Web page that can be navigated to gain access to the data service, its distributions and/or additional information.


- field_name: access_rights
  label: Access rights
  validators: ignore_missing unicode_safe
  help_text: Information that indicates whether the data service is Open Data, has access restrictions or is not public.

- field_name: theme
  label: Theme
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: A category of the data service. A Dataset may be associated with multiple themes.

- field_name: documentation
  label: Documentation
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: A page or document about this data service.

- field_name: conforms_to
  label: Conforms to
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: An implementing rule or other specification that the data service follows.

- field_name: applicable_legislation
  label: Applicable legislation
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: The legislation that mandates the creation or management of the data service.


#- field_name: hvd_category
#  label: HVD Category
#  preset: multiple_text
#  validators: ignore_missing scheming_multiple_text
# TODO: implement separately as part of wider HVD support

# Note: if not provided, this will be autogenerated
- field_name: uri
  label: URI
  help_text: An URI for this data service (if not provided it will be autogenerated).

# TODO: check if resource is needed at all

resource_fields:

- field_name: url
  label: URL
  preset: resource_url_upload

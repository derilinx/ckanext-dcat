scheming_presets_version: 1
about: Presets for the ckanext-dcat extension
about_url": "http://github.com/ckan/ckanext-dcat"

presets:

- preset_name: dcat_date
  values:
    # Note: use datetime.html or datetime_tz.html if you want to inclue an input for time
    form_snippet: date.html
    display_snippet: dcat_date.html
    validators: ignore_missing dcat_date convert_to_json_if_datetime

- preset_name: cr_title
  values:
    validators: not_empty unicode_safe
    form_snippet: large_text.html
    form_attrs:
      data-module: slug-preview-target

# Select existing datasets, storing a list of dataset ids (as in the `multiple_text` preset).
# Supported field keys:
#   dataset_types: list of dataset types that can be selected, defaults to "dataset"
#   form_placeholder: placeholder for the search input
#   source: endpoint to query when searching for datasets
- preset_name: dcat_dataset_select
  values:
    form_snippet: dataset_select.html
    display_snippet: dataset_select.html
    validators: ignore_missing scheming_multiple_text
    output_validators: scheming_load_json
